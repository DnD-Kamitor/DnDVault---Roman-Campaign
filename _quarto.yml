project:
  type: book
  output-dir: _book
  pre-render: python3 scripts/build_tables.py

book:
  title: "The Shadow of Mars"
  subtitle: "A Roman Campaign in Five Acts"
  author: "Campaign Module"
  date: "2026-01-18"
  repo-url: https://github.com/DnD-Kamitor/DnDVault---Roman-Campaign
  repo-actions: [issue]
  chapters:
    - index.qmd
    - player_intro.qmd
    - part: "Part I: The World"
      chapters:
        - player_guide.qmd
        - peoples.qmd
        - skills.qmd
        - session0.qmd
        - calendar.qmd
        - knowledge.qmd
    - part: "Part II: The Camp"
      chapters:
        - player_tome.qmd
        - vindolanda_guide.qmd
        - professions.qmd
        - roles.qmd
        - supplies.qmd
        - food.qmd
        - roman_tactics.qmd
        - bestiary.qmd
    - part: "Part III: The Campaign"
      chapters:
        - corruption.qmd
        - reputation.qmd
        - journal.qmd
        - atmosphere.qmd
    - part: "GM's Workbook"
      chapters:
        - CAMPAIGN_LOG.md
        - gm_intro.qmd
        - gm_session0.qmd
        - skill_framework.qmd
        - germanic_tribes.qmd
        - locations.qmd
        - camp_economy.qmd
        - gm_tools/session_template.qmd
        - chapter1.qmd
        - gm_tools/chapter01_guide.qmd
        - gm_tools/chapter01_maptool.qmd
        - chapter2.qmd
        - gm_tools/chapter02_guide.qmd
        - gm_tools/chapter02_maptool.qmd
        - handouts/chapter02_handouts.qmd
        - chapter3.qmd
        - gm_tools/chapter03_guide.qmd
        - gm_tools/chapter03_maptool.qmd
        - handouts/chapter03_handouts.qmd
        - chapter4.qmd
        - gm_tools/chapter04_guide.qmd
        - gm_tools/chapter04_maptool.qmd
        - handouts/chapter04_handouts.qmd
        - chapter5.qmd
        - gm_tools/chapter05_guide.qmd
        - gm_tools/chapter05_maptool.qmd
        - handouts/chapter05_handouts.qmd
        - appendix.qmd

format:
  html:
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom.scss]
    highlight-style: atom-one
    code-copy: true
    toc: true
    toc-depth: 3
    number-sections: false
    grid:
      sidebar-width: 280px
      body-width: 760px
      margin-width: 260px
  pdf:
    documentclass: scrreprt
    geometry: "letterpaper,margin=1in"
    toc: true
    number-sections: false
