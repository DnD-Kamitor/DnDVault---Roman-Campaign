<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Handout 7: The Bloody Message</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Caveat:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #060402;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  /* bark / wood texture card */
  .card {
    width: 460px;
    background: #2c1e10;
    background-image:
      repeating-linear-gradient(
        178deg,
        rgba(40,25,10,0.8) 0px, rgba(40,25,10,0.8) 2px,
        rgba(55,35,18,0.6) 2px, rgba(55,35,18,0.6) 6px,
        rgba(35,22,10,0.9) 6px, rgba(35,22,10,0.9) 9px,
        rgba(50,32,16,0.7) 9px, rgba(50,32,16,0.7) 14px
      ),
      radial-gradient(ellipse at 30% 30%, rgba(80,50,20,0.4) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 70%, rgba(20,10,4,0.6) 0%, transparent 50%);
    border: none;
    padding: 56px 60px;
    position: relative;
    box-shadow: 0 8px 36px rgba(0,0,0,0.9);
    border-radius: 3px;
  }

  /* grain lines top and bottom simulate bark strip */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 8px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
  }
  .card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 8px;
    background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
  }

  /* gash in bark */
  .gash {
    position: absolute;
    top: 22px; left: 40px;
    width: 180px; height: 3px;
    background: rgba(0,0,0,0.7);
    transform: rotate(-4deg);
    border-radius: 2px;
  }

  .latin-line {
    font-family: 'Cinzel', serif;
    font-size: 26px;
    font-weight: 700;
    color: #c01818;
    text-align: center;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1.3;
    /* blood text: slight drip shadow */
    text-shadow:
      0 2px 6px rgba(180,0,0,0.5),
      0 4px 2px rgba(100,0,0,0.3),
      0 6px 1px rgba(60,0,0,0.15);
  }

  .latin-translation {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: rgba(180,80,80,0.6);
    text-align: center;
    letter-spacing: 0.2em;
    margin-top: 6px;
    font-style: italic;
  }

  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(180,0,0,0.4), transparent);
    margin: 28px 0;
  }

  .second-line {
    font-family: 'Caveat', cursive;
    font-size: 17px;
    font-weight: 400;
    color: #a04040;
    text-align: center;
    letter-spacing: 0.06em;
    line-height: 1.5;
    opacity: 0.85;
    /* shaky, barely controlled */
    transform: rotate(-1.2deg);
  }

  .print-btn {
    display: block;
    margin: 28px auto 0;
    padding: 9px 24px;
    background: #1a0a04;
    color: #906040;
    border: 1px solid #4a2010;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    cursor: pointer;
    border-radius: 2px;
    text-transform: uppercase;
  }
  .print-btn:hover { background: #2a1408; }

  @media print {
    body { background: white; padding: 0; }
    .card { box-shadow: none; border: 2px solid #4a2010; width: 100%; max-width: 460px; margin: 0 auto; }
    .print-btn { display: none; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="gash"></div>

  <div class="latin-line">Mars Videt Omnia</div>
  <div class="latin-translation">Mars sees all</div>

  <div class="divider"></div>

  <div class="second-line">I did not want to do this.</div>
</div>

<button class="print-btn" onclick="window.print()">Print &mdash; Save as PDF</button>

</body>
</html>
