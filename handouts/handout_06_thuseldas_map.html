<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Handout 6: Thusnelda's Map</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0c0804;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .page {
    width: 500px;
    /* rough torn parchment — darker, more worn */
    background: #b89045;
    background-image:
      radial-gradient(ellipse at 40% 30%, rgba(160,100,10,0.3) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 70%, rgba(80,40,0,0.4) 0%, transparent 45%),
      radial-gradient(ellipse at 15% 80%, rgba(60,30,0,0.35) 0%, transparent 40%),
      repeating-linear-gradient(87deg, transparent, transparent 28px, rgba(0,0,0,0.02) 28px, rgba(0,0,0,0.02) 29px);
    padding: 36px 36px 44px;
    position: relative;
    box-shadow: 0 6px 30px rgba(0,0,0,0.7), inset 0 0 40px rgba(80,40,0,0.2);
    /* irregular edges — torn parchment */
    clip-path: polygon(
      0% 0%,
      96% 0%,
      100% 4%,
      99% 8%,
      100% 15%,
      98% 30%,
      100% 50%,
      99% 70%,
      100% 85%,
      97% 92%,
      100% 100%,
      4% 100%,
      0% 96%,
      2% 80%,
      0% 60%,
      1% 40%,
      0% 20%
    );
  }

  .map-title {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    font-weight: 600;
    color: #2a1000;
    text-align: center;
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }

  /* The SVG map drawing */
  .map-svg-wrap {
    background: rgba(0,0,0,0.06);
    border: 1px dashed rgba(60,30,0,0.35);
    border-radius: 2px;
    padding: 8px;
    margin: 12px 0;
  }

  .map-label {
    font-family: 'Caveat', cursive;
    font-size: 11px;
    color: #3a1800;
    font-style: italic;
  }

  .germanic-text {
    font-family: 'Caveat', cursive;
    font-size: 14px;
    font-weight: 600;
    color: #2a1000;
    text-align: center;
    margin-top: 12px;
    line-height: 1.6;
    padding: 8px 0;
    border-top: 1px solid rgba(60,30,0,0.3);
  }

  .translation {
    font-family: 'IM Fell English', Georgia, serif;
    font-size: 11px;
    font-style: italic;
    color: #6a3a10;
    text-align: center;
    margin-top: 4px;
  }

  .note {
    font-family: 'Caveat', cursive;
    font-size: 11.5px;
    color: #6a3a10;
    text-align: right;
    margin-top: 10px;
    padding-right: 4px;
  }

  .print-btn {
    display: block;
    margin: 28px auto 0;
    padding: 9px 24px;
    background: #3a1a00;
    color: #c8900a;
    border: 1px solid #6a3808;
    font-family: 'IM Fell English', Georgia, serif;
    font-size: 11px;
    font-style: italic;
    cursor: pointer;
    border-radius: 2px;
  }
  .print-btn:hover { background: #5a2600; }

  @media print {
    body { background: white; padding: 0; }
    .page { box-shadow: none; clip-path: none; border: 1px solid #8a6030; width: 100%; max-width: 500px; margin: 0 auto; }
    .print-btn { display: none; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="map-title">To the sacred place</div>

  <div class="map-svg-wrap">
    <svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
      <defs>
        <!-- parchment bg inside svg -->
        <filter id="rough">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
          <feColorMatrix type="saturate" values="0"/>
          <feBlend in="SourceGraphic" mode="multiply"/>
        </filter>
      </defs>

      <!-- River 1 (westernmost) — wavering line -->
      <path d="M 40,20 Q 45,60 38,100 Q 35,140 42,180 Q 38,210 45,250 Q 42,280 40,310"
            fill="none" stroke="#4a6080" stroke-width="3.5" stroke-linecap="round"
            stroke-dasharray="1,0" opacity="0.7"/>
      <text x="16" y="155" fill="#3a4a60" font-family="Caveat,cursive" font-size="10" opacity="0.8">I</text>

      <!-- River 2 (central) -->
      <path d="M 170,10 Q 165,50 168,90 Q 172,130 166,170 Q 163,210 170,250 Q 168,285 172,310"
            fill="none" stroke="#4a6080" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
      <text x="178" y="155" fill="#3a4a60" font-family="Caveat,cursive" font-size="10" opacity="0.8">II</text>

      <!-- River 2 ford (two parallel dashes) -->
      <line x1="158" y1="180" x2="182" y2="180" stroke="#4a6080" stroke-width="2" opacity="0.9"/>
      <line x1="158" y1="188" x2="182" y2="188" stroke="#4a6080" stroke-width="2" opacity="0.9"/>
      <text x="186" y="188" fill="#3a1800" font-family="Caveat,cursive" font-size="9" font-style="italic">ford</text>

      <!-- River 3 -->
      <path d="M 300,15 Q 295,55 298,95 Q 303,135 296,175 Q 292,215 298,255 Q 296,285 300,310"
            fill="none" stroke="#4a6080" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
      <text x="308" y="155" fill="#3a4a60" font-family="Caveat,cursive" font-size="10" opacity="0.8">III</text>

      <!-- River 4 — smudged/hidden (charcoal thumbprint effect) -->
      <path d="M 380,40 Q 375,80 378,120 Q 382,140"
            fill="none" stroke="#3a3030" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
      <ellipse cx="382" cy="140" rx="22" ry="16" fill="rgba(40,20,0,0.45)" opacity="0.6"/>
      <text x="358" y="168" fill="#5a3a20" font-family="Caveat,cursive" font-size="9" font-style="italic">?</text>

      <!-- Standing stones ring (7 stones) -->
      <g transform="translate(210, 130)">
        <!-- ring guide (invisible) -->
        <!-- stones at 7 positions around ring radius 55 -->
        <!-- ᛏ ᚺ ᚾ ᛁ ᛟ and two more -->
        <rect x="-3" y="-62" width="6" height="14" rx="2" fill="#5a4a30" transform="rotate(0)"/>
        <text x="-5" y="-65" fill="#3a2a18" font-family="serif" font-size="9">ᛏ</text>

        <rect x="-3" y="-62" width="6" height="14" rx="2" fill="#5a4a30" transform="rotate(52)"/>
        <text transform="rotate(52) translate(-5,-65)" fill="#3a2a18" font-family="serif" font-size="9">ᚺ</text>

        <rect x="-3" y="-62" width="6" height="14" rx="2" fill="#5a4a30" transform="rotate(103)"/>
        <text transform="rotate(103) translate(-5,-65)" fill="#3a2a18" font-family="serif" font-size="9">ᚾ</text>

        <rect x="-3" y="-62" width="6" height="14" rx="2" fill="#5a4a30" transform="rotate(154)"/>
        <text transform="rotate(154) translate(-5,-65)" fill="#3a2a18" font-family="serif" font-size="9">ᛁ</text>

        <rect x="-3" y="-62" width="6" height="14" rx="2" fill="#5a4a30" transform="rotate(206)"/>
        <text transform="rotate(206) translate(-5,-65)" fill="#3a2a18" font-family="serif" font-size="9">ᛟ</text>

        <rect x="-3" y="-62" width="6" height="14" rx="2" fill="#5a4a30" transform="rotate(257)"/>
        <rect x="-3" y="-62" width="6" height="14" rx="2" fill="#5a4a30" transform="rotate(309)"/>

        <!-- crossed spears over grove -->
        <line x1="-18" y1="-18" x2="18" y2="18" stroke="#3a2a10" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="18" y1="-18" x2="-18" y2="18" stroke="#3a2a10" stroke-width="2.5" stroke-linecap="round"/>

        <text x="-28" y="30" fill="#3a2a18" font-family="Caveat,cursive" font-size="10" font-style="italic">the grove</text>
      </g>

      <!-- Compass rose -->
      <g transform="translate(380, 280)">
        <line x1="0" y1="-14" x2="0" y2="14" stroke="#5a4a30" stroke-width="1.5"/>
        <line x1="-14" y1="0" x2="14" y2="0" stroke="#5a4a30" stroke-width="1.5"/>
        <text x="-3" y="-16" fill="#3a2a18" font-family="Caveat,cursive" font-size="10">N</text>
      </g>

      <!-- Tree clusters along sides -->
      <g fill="#3a5028" opacity="0.5">
        <circle cx="90" cy="50" r="8"/>
        <circle cx="105" cy="45" r="6"/>
        <circle cx="80" cy="60" r="5"/>
        <circle cx="90" cy="200" r="7"/>
        <circle cx="104" cy="195" r="5"/>
        <circle cx="350" cy="80" r="8"/>
        <circle cx="362" cy="74" r="5"/>
        <circle cx="345" cy="220" r="6"/>
        <circle cx="358" cy="215" r="7"/>
      </g>
    </svg>
  </div>

  <div class="germanic-text">Mannaz raidho wunjo</div>
  <div class="translation">"The man who makes this journey finds what he seeks."</div>
  <div class="note">— T.</div>
</div>

<button class="print-btn" onclick="window.print()">Print &mdash; Save as PDF</button>

</body>
</html>
