<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2260" viewBox="0 0 1200 2260">

  </pattern>

    <rect width="40" height="40" fill="#3e3428"/>

    <text x="20" y="26" text-anchor="middle" font-size="18" fill="rgba(120,200,255,0.55)" font-family="serif">ᚦ</text>
  </pattern>

  <!-- Altar chamber floor -->
  <pattern id="stone_altar" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="#6a5e4c"/>
    <rect x="1" y="1" width="38" height="38" fill="none" stroke="#4a4030" stroke-width="0.6"/>

    <line x1="0" y1="0" x2="0" y2="40" stroke="#4a4030" stroke-width="0.8"/>

  <pattern id="water" x="0" y="0" width="80" height="20" patternUnits="userSpaceOnUse">
    <rect width="80" height="20" fill="#162a42"/>
    <path d="M0,10 Q20,4 40,10 Q60,16 80,10" stroke="#1e3a58" stroke-width="1.5" fill="none"/>
    <path d="M0,16 Q20,10 40,16 Q60,22 80,16" stroke="#1a3450" stroke-width="1" fill="none" opacity="0.5"/>
  </pattern>

  <!-- Grid overlay -->
  <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(0,0,0,0.22)" stroke-width="0.6"/>
  </pattern>

  <!-- Clip for Altar Chamber circle -->
  <clipPath id="altarCircle">
    <circle cx="600" cy="2040" r="185"/>
  </clipPath>

  <!-- Glow filter for runes -->
  <filter id="runeGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
